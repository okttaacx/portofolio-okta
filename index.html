    <!-- FIX #1: Theme script PERTAMA sebelum apapun — cegah flash of wrong theme -->
    <!-- FIX #2: Konsistenkan ke document.body (sama dengan semua komponen React) -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
          document.body && document.body.classList.add('dark-mode');
        }
      })();
    </script>
